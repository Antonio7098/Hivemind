name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out unified-content-protocol
        run: git clone --depth 1 https://github.com/Antonio7098/unified-content-protocol ../unified-content-protocol

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-features

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out unified-content-protocol
        run: git clone --depth 1 https://github.com/Antonio7098/unified-content-protocol ../unified-content-protocol

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run targeted architecture smoke tests
        run: |
          cargo test --test runtime_scope
          cargo test --test query_views
          cargo test --test flow_lifecycle
          cargo test --test integration_remainder
          cargo test native::tests

      - name: Run tests
        run: cargo nextest run --all-features --test-threads=2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out unified-content-protocol
        run: git clone --depth 1 https://github.com/Antonio7098/unified-content-protocol ../unified-content-protocol

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Architecture guardrails
        run: python3 scripts/check_architecture.py

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
